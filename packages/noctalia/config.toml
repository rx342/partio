config_version = 20

[bar.default]
position = "left"
start = ["workspaces", "privacy", "media", "audio_visualizer"]
center = ["clock"]
end = ["tray", "network", "notifications", "volume", "brightness", "battery"]
thickness = 60
scale = 1.25
font_family = "Maple Mono NF CN"

[widget.workspaces]
show_labels = false
hide_when_empty = true

[widget.tray]
colorize_icons = false
drawer = true
hidden = ["nm-applet", "blueman"]

[widget.clock]
format = "{:%a:%e}\n\n{:%H:%M}"
color = "tertiary"
font_weight = 700

[widget.network]
color = "#7AA2F7"

[widget.notifications]
color = "#E0AF68"

[widget.volume]
color = "#41A6B5"

[widget.battery]
color = "#BB9AF7"

[shell]
telemetry_enabled = false

[theme]
source = "custom"
custom_palette = "custom-tokyo-night"
mode = "auto"

[notification]
enable_daemon = true
position = "bottom_right"

[wallpaper]
enabled = true

[wallpaper.default]
path = "~/.local/share/wallpapers/home.png"

[weather]
enabled = false
