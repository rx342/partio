config_version = 20

[bar.default]
position = "left"
start = ["workspaces", "privacy", "media", "audio_visualizer"]
center = ["clock"]
end = ["tray", "network", "notifications", "volume", "brightness", "battery"]
thickness = 60
scale = 1.25
font_family = "Maple Mono NF CN"

[widget.workspaces]
show_labels = false
hide_when_empty = true

[widget.tray]
drawer = true

[widget.clock]
format = "{:%a\n%e}\n\n{:%H:%M}"
color = "tertiary"
font_weight = 700

[widget.network]
color = "#7AA2F7"

[widget.notifications]
color = "#E0AF68"

[widget.volume]
color = "#41A6B5"

[widget.battery]
color = "#BB9AF7"

[shell]
avatar_path = "~/.local/share/wallpapers/id.png"
telemetry_enabled = false
setup_wizard_enabled = false
clipboard_enabled = false
show_location = false

[shell.animation]
enabled = true
speed = 2.0

[theme]
source = "custom"
custom_palette = "custom-tokyo-night"
mode = "auto"

[notification]
enable_daemon = true
position = "bottom_right"

[wallpaper]
enabled = true

[wallpaper.default]
path = "~/.local/share/wallpapers/home.png"

[lockscreen]
transition = [ "fade" ]

[lockscreen_widgets]
enabled = true
schema_version = 2

[lockscreen_widgets.widget.login_box]
type = "login_box"
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 825.0
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0

[lockscreen_widgets.widget.login_box.settings]
background_color = "on_primary"
background_opacity = 0.80
background_radius = 12.0
center_password_text = true
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = false
show_media = true
show_password_reveal = false
show_session_buttons = false
show_unlock_hint = false
show_weather = false

[lockscreen_widgets.widget.clock]
type = "clock"
box_height = 309.1484375
box_width = 625.12109375
cx = 960.0
cy = 417.42578125
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0

[lockscreen_widgets.widget.clock.settings]
background_opacity = 0.0
