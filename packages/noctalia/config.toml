config_version = 20

[bar.default]
position = "left"
start = ["workspaces", "media", "audio_visualizer"]
center = ["clock"]
end = ["tray", "privacy", "network", "notifications", "volume", "brightness", "battery"]
thickness = 60
scale = 1.25
font_family = "Maple Mono NF CN"
radius_top_left = 0
radius_top_right = 20
radius_bottom_left = 0
radius_bottom_right = 20
margin_ends = 0

[widget.workspaces]
show_labels = false
hide_when_empty = true
show_tooltip = false

[widget.audio_visualizer]
color_1 = "tertiary"
color_2 = "secondary"

[widget.tray]
drawer = true

[widget.clock]
format = "{:%a\n%e}\n\n{:%H:%M}"
color = "tertiary"
font_weight = 700

[widget.network]
color = "#7AA2F7"
peek = true

[widget.notifications]
color = "#E0AF68"

[widget.volume]
color = "#41A6B5"
peek = true

[widget.battery]
color = "#BB9AF7"

[shell]
avatar_path = "~/.local/share/wallpapers/id.png"
telemetry_enabled = false
setup_wizard_enabled = false
clipboard_enabled = false
show_location = false

[shell.animation]
enabled = true
speed = 2.0

[theme]
source = "custom"
custom_palette = "custom-tokyo-night"
mode = "auto"

[notification]
enable_daemon = true
position = "bottom_right"

[wallpaper]
enabled = true

[wallpaper.default]
path = "~/.local/share/wallpapers/home.png"

[weather]
enabled = false

[control_center.calendar]
show_events_card = false

[lockscreen]
transition = [ "fade" ]
tint_intensity = 0.15
